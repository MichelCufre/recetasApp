services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barflow
      POSTGRES_USER: barflow
      POSTGRES_PASSWORD: barflow
    ports:
      - "5432:5432"
    volumes:
      - barflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  barflow_data:
